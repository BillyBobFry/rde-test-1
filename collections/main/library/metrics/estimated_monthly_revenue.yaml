name: Estimated monthly revenue
description: 'Self-consistent only, no external reference; an estimate, not billed revenue. Monthly list price in USD of every paying key: Value $9.99, Regular $19.99, Complete $39.99, from the public plans list on 30 Oct 2026. Paying means not a test key and every plan setting matches exactly (D12). No billing data exists, so it ignores discounts, annual plans, failed payments and old prices, and counts lapsed subscribers who kept their settings. Also called MRR. Snapshot of the app DB as of the refresh date. Not comparable to accounting revenue. Owner: Will Fry.'
