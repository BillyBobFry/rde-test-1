dataset_query:
  database: Trivia API Logs
  stages:
  - native: 'SELECT feature_group, feature, COUNT(DISTINCT IF(caller_type = ''Paid key'' AND successful_requests > 0, key_hash, NULL)) AS paid_keys_using_it, SUM(IF(caller_type = ''Paid key'', successful_requests, 0)) AS paid_key_requests, SUM(IF(caller_type = ''Free (no key)'', successful_requests, 0)) AS free_tier_requests, SUM(failed_requests) AS rejected_requests FROM ({{snippet: Trivia API feature usage by key and day}}) b GROUP BY 1, 2 ORDER BY 3 DESC, 4 DESC'
    template-tags:
    - display-name: Trivia API feature usage by key and day
      id: 7f80907a-26fb-4ad8-8f96-e73fdc172dbe
