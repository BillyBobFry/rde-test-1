  visualization_settings:
    text: '**Definitions.** **Estimated monthly revenue:** monthly list price of every paying key, from the public plans list (Value $9.99, Regular $19.99, Complete $39.99); ignores discounts, annual plans and failed payments. **Paying customer:** not a test key, and every setting matches a plan exactly; a lapsed subscriber who kept the settings still counts. **Credits:** 1 per /questions request, 50 per answer validation. **Active key:** charged at least one credit in the month, on a plan or not. **Free tier:** requests with no key; bots are not filtered. **Server error rate:** status 500 or above as a share of all requests.'
    virtual_card:
      display: text
