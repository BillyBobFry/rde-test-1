description: 'One row per: day, caller type and API key. Key: key_day_key. Sources: stg_trivia_request, mart_trivia_dim_api_key. Definition: API requests per key per day; all no-key traffic is one row per day. Caveats: D1 success is status below 400. D2 a key missing from the app DB is unrecognised. D5 no key is free tier. Plan and paying status are today''s. Today and 2026-10-02 are flagged incomplete.'
