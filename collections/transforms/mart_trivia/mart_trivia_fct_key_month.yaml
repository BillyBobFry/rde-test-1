description: 'One row per: API key and month with usage. Key: key_month_key. Sources: stg_trivia_key_usage_month, mart_trivia_dim_api_key. Definition: credits charged per key per month, and the share of the key''s limit they used. Caveats: plan and paying status are today''s, not as of that month, so history is not a past customer count. Months with no usage have no row. The snapshot''s own month is flagged incomplete. D15 stale until the refresh script reruns.'
entity_id: Mwar56scc6p5kUACfHV2i
