description: 'One row per: API key. Key: key_id. Sources: stg_trivia_api_key, stg_trivia_key_usage_month, cfg_trivia_plan. Definition: each key, the public plan its settings match, and whether it counts as a paying customer. Caveats: D12 paying means not a test key and every plan setting matches exactly; there is no billing data, so a lapsed subscriber who kept the settings still counts. D11 revenue is list price, an estimate. D15 snapshot, stale until the refresh script reruns.'
