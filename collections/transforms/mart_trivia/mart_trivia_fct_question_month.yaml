source:
  query:
    database: Trivia API Logs
    stages:
    - native: |
        -- One row per: month created and review state
        -- Key:         question_month_key
        -- Sources:     stg_trivia_question_month
        -- Definition:  questions created per month by state, with the running total of each state
        -- Caveats:     state is today's, not as of that month. Question text is not copied. 5,661 pending questions are from 2023 or earlier. D15 stale until the refresh script reruns.
        SELECT
          CONCAT(CAST(q.created_month AS STRING), '|', q.question_state) AS question_month_key,
          q.created_month,
          q.question_state,
          q.question_state = 'approved' AS is_approved,
          q.question_count,
          SUM(q.question_count) OVER (PARTITION BY q.question_state ORDER BY q.created_month) AS running_question_count,
          q.snapshot_date
        FROM trivia_analytics.stg_trivia_question_month q
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
