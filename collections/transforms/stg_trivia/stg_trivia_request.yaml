description: 'One row per: API request logged by the server. Key: request_id. Sources: trivia_api_logs.run_googleapis_com_stdout. Definition: each logged request with its normalised route, outcome and caller. Caveats: caller IP and user agent are not carried. D1 success means status below 400. D2 a key with no user id is unrecognised. D5 no key means free tier. D7 logs start 2026-10-02 10:21 UTC, so that day and today are flagged incomplete.'
