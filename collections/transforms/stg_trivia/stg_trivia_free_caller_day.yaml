description: 'One row per: day. Key: request_date. Sources: trivia_api_logs.run_googleapis_com_stdout. Definition: distinct IP addresses calling the API with no key that day. Caveats: D14 counts only; no IP is stored. IPs are not people: shared networks undercount and roaming devices overcount. Days do not add up.'
