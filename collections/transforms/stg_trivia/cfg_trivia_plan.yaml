description: |
  One row per: public plan. Key: plan_name. Sources: constants from the public /products list, copied 2026-10-30. Definition: each plan's list price and the exact settings a key needs to count as being on it. Caveats: D11 prices assumed monthly, USD. D12 a key is on a plan only when every setting matches. Change a price here, then run the daily job.
