source:
  query:
    database: Trivia API Logs
    stages:
    - native: |
        -- One row per: public plan
        -- Key:         plan_name
        -- Sources:     none; constants copied from the public GET /products list on 2026-10-30
        -- Definition:  each plan's list price and the exact settings a key needs to count as being on it
        -- Caveats:     D11 prices assumed monthly, in USD; the list does not state the billing period. D12 a key is on a plan only when every setting here matches.
        SELECT * FROM UNNEST([
          STRUCT('Value' AS plan_name, 9.99 AS monthly_list_price_usd, 100000 AS request_limit, 5 AS quiz_limit, 20 AS quiz_question_limit, FALSE AS can_search, FALSE AS can_skip_rate_limit, FALSE AS can_use_sessions, FALSE AS can_use_image_choice, FALSE AS can_use_text_input, FALSE AS can_use_translations),
          STRUCT('Regular', 19.99, 1000000, 100, 100, TRUE, TRUE, TRUE, FALSE, FALSE, FALSE),
          STRUCT('Complete', 39.99, 5000000, 1000, 100, TRUE, TRUE, TRUE, TRUE, TRUE, TRUE)
        ])
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
